    branches:
      - main
    paths:
      - 'telemetry/dumps/*.log'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  bitflip-delta-scanner:
    name: "Execute Sovereign Bit-Flip Delta Scanner"
    runs-on: ubuntu-latest

    steps:
