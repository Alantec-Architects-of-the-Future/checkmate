name: "Node 005: Sovereign Monetization Engine"

on:
  sponsors:
    types:
      - created
      - cancelled
      - tier_changed
      - upgraded
      - downgraded
  workflow_dispatch:

jobs:
  sovereign-monetization-orchestrator:
    name: "Orchestrate Access & Financial Governance"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Sovereign Architecture"
        uses: actions/checkout@v4

      - name: "Decode Sponsor Payload"
        id: decode_payload
        run: |
          echo "=== NODE 005: SOVEREIGN MONETIZATION ACTIVATED ==="
          SPONSOR_HANDLE="${{ github.event.sponsor.login }}"
          TIER_PRICE="${{ github.event.tier.monthly_price_in_dollars }}"
          EVENT_ACTION="${{ github.event.action }}"

          echo "Sponsor: $SPONSOR_HANDLE"
          echo "Tier Value: $$TIER_PRICE"
          echo "Action: $EVENT_ACTION"

          echo "sponsor_handle=$SPONSOR_HANDLE" >> $GITHUB_OUTPUT
          echo "tier_price=$TIER_PRICE" >> $GITHUB_OUTPUT

      - name: "Evaluate & Grant Sovereign Access"
        env:
          GH_TOKEN: ${{ secrets.ORGANIZATION_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          SPONSOR_USER: ${{ steps.decode_payload.outputs.sponsor_handle }}
          TIER_PRICE: ${{ steps.decode_payload.outputs.tier_price }}
        run: |
          if [ -z "$SPONSOR_USER" ]; then
            echo "Manual execution triggered or event without explicit sponsor."
            exit 0
          fi

          if [ "$TIER_PRICE" -ge 500 ]; then
            echo "SUPREME LEVEL ($500+): Granting full access to 'checkmate-1' and 'checkmate-2'..."
            # Add official API invite for elite repositories
          elif [ "$TIER_PRICE" -ge 100 ]; then
            echo "HIGH LEVEL ($100-$200): Granting access to 'checkmate-1'..."
            # Add official API invite for checkmate-1
          else
            echo "BASIC LEVEL ($TIER_PRICE): Access retained at public layer."
          fi

      - name: "Audit Trail & Integrity Log"
        run: |
          echo "Node 005 executed successfully. Financial state and access control calibrated."  
