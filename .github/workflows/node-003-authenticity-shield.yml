name: "003/500 - Alantec Sovereign Authenticity Shield"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sovereign-node-003:
    name: "sovereign-node-003 / Authenticity & Identity Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Verify Commit Signature & Author Authority
        run: |
          echo "=================================================="
          echo "ALANTEC SOVEREIGN INTEGRITY ENGINE - NODE 003"
          echo "=================================================="
          echo "Author/Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "=================================================="

          LAST_COMMIT=$(git log -1 --format="%H")
          AUTHOR_NAME=$(git log -1 --format="%an")
          AUTHOR_EMAIL=$(git log -1 --format="%ae")
          
          echo "Last Commit Hash: $LAST_COMMIT"
          echo "Author Name: $AUTHOR_NAME"
          echo "Author Email: $AUTHOR_EMAIL"
          echo "--------------------------------------------------"

          # Validação de Autoria e Autoridade Técnica
          if [[ "${{ github.actor }}" != "Jeanlaris" && "${{ github.actor }}" != "jeanlaris" ]]; then
            echo "⚠️ Aviso: Execução disparada por ator fora do núcleo primário (${{ github.actor }})."
          else
            echo "✅ Autoridade Confirmada: Operação assinada por Jean Laris."
          fi

      - name: 📊 Generate Sovereign Matrix Artifact
        run: |
          mkdir -p artifacts
          echo "NODE_003_STATUS=SUCCESS" > artifacts/node-003.env
          echo "AUTHORITY=Jean Laris" >> artifacts/node-003.env
          echo "ORGANIZATION=Alantec Architects of the Future" >> artifacts/node-003.env
          echo "NODE_003_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> artifacts/node-003.env
          echo "✅ Matrix Artifact Gerado com Sucesso."

      - name: 🎉 Finalize Node 003 Execution
        run: |
          echo "=================================================="
          echo "✅ NODE 003 (Shield of Authenticity) VALIDADO COM SUCESSO!"
          echo "=================================================="
