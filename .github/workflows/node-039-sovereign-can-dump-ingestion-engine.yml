      - main
    paths:
      - 'telemetry/dumps/*.log'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  can-dump-ingestion:
    name: "Execute Sovereign CAN Dump Ingestion Engine"
    runs-on: ubuntu-latest

    steps:
