name: "Node 006: Sovereign Testing Matrix Engine"

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  sovereign-testing-orchestrator:
    name: "Execute Python Testing Matrix"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: "Checkout Sovereign Architecture"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"

      - name: "Install Master Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov fastapi pydantic uvicorn

      - name: "Execute Test Suite"
        run: |
          echo "=== NODE 006: SOVEREIGN TESTING MATRIX ACTIVATED ==="
          python -m pytest --maxfail=1 --disable-warnings

      - name: "Audit Trail & Integrity Log"
        run: |
          echo "Node 006 executed successfully across Python ${{ matrix.python-version }} matrix. Quality state calibrated."
