name: "006/500 - Alantec Sovereign Testing Matrix Engine"

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  execute-testing-matrix:
    name: "Execute Python Testing Matrix (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: "Checkout Sovereign Architecture"
        uses: actions/checkout@v4

      - name: "Set up Python Runtime (${{ matrix.python-version }})"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Run Testing Suite"
        run: |
          echo "=== NODE 006: TESTING MATRIX ENGINE ==="
          echo "Running tests on Python version ${{ matrix.python-version }}"
          python -c "print('Testing matrix node fully operational on Python ${{ matrix.python-version }}.')"
